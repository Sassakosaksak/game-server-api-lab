name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGetパッケージを復元
        run: dotnet restore GameServerApi.csproj

      - name: Release構成でビルド
        run: dotnet build GameServerApi.csproj --configuration Release --no-restore
