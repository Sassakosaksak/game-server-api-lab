services:
  db:
    image: postgres:16
    container_name: game-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - game-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: game-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: game-api
    environment:
      ConnectionStrings__GameDb: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Redis__Configuration: "redis:6379,abortConnect=false"
      Features__EnableTestDataApi: ${ENABLE_TEST_DATA_API:-false}
      TestApi__Key: ${TEST_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    profiles: ["load-test"]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./load-tests:/scripts:ro
    entrypoint: ["k6", "run", "/scripts/rankings.js"]

volumes:
  game-db-data:
